[workspace]
members = [".", "benchmarks", "consumer-tests"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85.0"
repository = "https://github.com/thehouseisonfire/atomic-blob-store"
license = "MIT OR Apache-2.0"
authors = ["thehouseisonfire <lefttolive@proton.me>"]

[profile.dev]
debug = false

[profile.release]
codegen-units = 1
lto = true
strip = true

[package]
name = "atomic-blob-store"
version = "0.1.2"
publish = true
description = "Interruption-resistant keyed blob streaming for trusted local filesystems"
keywords = ["atomic", "filesystem", "persistence", "snapshot"]
categories = ["filesystem"]
rust-version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
readme = "README.md"
exclude = ["docs/"]

[features]
default = []
bench-instrumentation = []
tokio = ["dep:tokio"]

[dependencies]
blake3 = { version = "1.8", features = ["pure"] }
crc32c = "0.6"
flume = { version = "0.12", default-features = false, features = ["async"] }
thiserror = "2.0.8"
tokio = { version = "1.40", features = [
    "io-util",
    "macros",
    "rt",
    "sync",
    "time",
], optional = true }

[target.'cfg(any(unix, windows))'.dependencies]
getrandom = { version = "0.4", features = ["std"] }

[target.'cfg(unix)'.dependencies]
atomic-write-file = "0.3"
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
] }

[[example]]
name = "config_snapshot"
required-features = ["tokio"]

[[example]]
name = "quarantine_corruption"
required-features = ["tokio"]

[[example]]
name = "shared_root_domains"
required-features = ["tokio"]

[[example]]
name = "worker_snapshots"
required-features = ["tokio"]
